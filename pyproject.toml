[project]
name = "llm-templates"
version = "0.2.0"
description = "Instruction/chat prompts creation library for text generation LLMs. It supports local and Hugging Face models."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Juan Pablo Manson", email = "jpmanson@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.32.4",
    "Jinja2>=2.11.3",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/jpmanson/llm_templates"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_templates"]

[tool.hatch.build.targets.sdist]
include = [
    "llm_templates",
    "README.md",
    "LICENSE",
]
